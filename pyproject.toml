[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-printer-server"
version = "0.1.0"
description = "Remote print server for a USB-connected printer. No third-party dependencies."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pandiyaraj Karuppasamy", email = "pandiyarajk@live.com" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["print-server", "printer", "http", "spool", "windows"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Development Status :: 3 - Alpha",
]

[project.scripts]
py-printer-server = "py_printer_server:main"
pps = "py_printer_server:main"

[tool.hatch.build.targets.wheel]
packages = ["py_printer_server"]

[tool.hatch.build.targets.sdist]
include = [
    "py_printer_server",
    "README.md",
    "LICENSE",
    "DISCLAIMER.md",
    "pyproject.toml",
]
